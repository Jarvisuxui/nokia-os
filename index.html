<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nokia OS">
<link rel="manifest" href="manifest.webmanifest">
<title>Nokia OS</title>
<style>
:root{--body:#0b0b0b;--screen:#d9e222;--ink:#111;--soft:#1c1c1c;--soft2:#242424;--green:#7dff2f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}html,body{margin:0;height:100%;background:#050505;font-family:"Courier New",monospace;overflow:hidden}body{display:grid;place-items:center}.phone{width:390px;height:844px;max-width:100vw;max-height:100dvh;background:var(--body);padding:max(18px,env(safe-area-inset-top)) 18px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;color:white}.brand{text-align:center;font:900 18px Arial,sans-serif;letter-spacing:-1px;height:24px;display:flex;align-items:center;justify-content:center}.display{height:360px;background:var(--screen);color:var(--ink);border-radius:18px;border:3px solid #191919;box-shadow:inset 0 0 0 3px #f0f45d55;overflow:hidden;position:relative}.page{position:absolute;inset:0;display:none;flex-direction:column;padding:18px}.page.on{display:flex}.status{font-size:13px;font-weight:900;display:flex;justify-content:space-between}.title{text-align:center;font-weight:900;font-size:18px;margin:6px 0 10px}.menu{display:flex;flex-direction:column;gap:2px}.menu button,.row{border:0;background:transparent;color:var(--ink);font:900 17px/1.1 monospace;text-align:left;padding:10px 8px}.menu button.selected{background:#343434;color:#fff}.softline{margin-top:auto;display:flex;justify-content:space-between;font-size:13px;font-weight:900}.messagebox{border:2px solid var(--ink);min-height:90px;padding:8px;font:900 17px monospace;overflow:auto}.hint{font-size:12px;margin-top:6px;min-height:15px}.rows{border-top:2px solid var(--ink)}.row{display:block;width:100%;border-bottom:2px solid var(--ink)}.row small{display:block;font-size:11px}.camera{flex:1;background:#272727;color:#d9e222;border:2px solid var(--ink);display:grid;place-items:center;text-align:center;font-weight:900}.keydeck{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}.navrow{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:10px;align-items:center}.softkey,.callkey,.navpad,.num{border:0;color:#fff;background:linear-gradient(#292929,#151515);box-shadow:inset 0 1px 0 #4b4b4b,0 3px 8px #000;border-radius:14px;font-weight:900}.softkey{height:48px}.callkey{height:48px;font-size:23px}.callkey.green{color:var(--green)}.navpad{height:82px;border:3px solid #efefef;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:3px}.navpad button{background:none;border:0;color:#fff;font-size:16px}.navpad .ok{grid-column:2;grid-row:2;border:2px solid #777;border-radius:7px}.up{grid-column:2}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1}.num{min-height:52px;font:900 19px Arial,sans-serif}.num span{display:block;font:700 9px Arial,sans-serif;margin-top:2px;letter-spacing:.3px}.num:active,.softkey:active,.callkey:active{transform:translateY(1px);filter:brightness(1.3)}.backbtn{position:absolute;top:9px;left:10px;border:0;background:none;font:900 26px monospace;color:var(--ink);z-index:4}.hasback .status{padding-left:22px}.counter{text-align:right;font-size:11px;margin-top:3px}.boot{align-items:center;justify-content:center;text-align:center}.boot h1{font-size:28px;margin:0 0 12px}.boot p{font-size:12px}@media(min-width:500px){.phone{border-radius:48px;box-shadow:0 30px 90px #000;height:min(94vh,844px)}}
</style></head>
<body><div class="phone"><div class="brand">NOKIA</div><div class="display">
<section id="boot" class="page boot on"><h1>NOKIA OS</h1><p>Classic interaction.<br>Modern phone.</p></section>
<section id="home" class="page"><div class="status"><span id="signal">▂▄▆█</span><span><b id="battery">76</b>% ▣</span></div><div class="title">Go to</div><div class="menu" id="homeMenu"><button class="selected" data-go="messages">Messages</button><button data-go="camera">Camera</button><button data-go="snake">Snake Classic Game</button><button data-go="contacts">Contacts</button><button data-go="settings">Customize Launcher</button></div><div class="softline"><span>Select</span><span>Exit</span></div></section>
<section id="messages" class="page hasback"><button class="backbtn" data-back>‹</button><div class="status"><span>MESSAGES</span><span>3</span></div><div class="title">Inbox</div><div class="rows"><button class="row" data-go="compose">New message</button><button class="row">Ana<small>¿Dónde estás?</small></button><button class="row">Mamá<small>Llámame luego</small></button></div><div class="softline"><span>Select</span><span>Back</span></div></section>
<section id="compose" class="page hasback"><button class="backbtn" data-back>‹</button><div class="status"><span>NEW MESSAGE</span><span id="modeLabel">abc</span></div><div class="messagebox" id="composeText"></div><div class="counter"><span id="count">0</span>/160</div><div class="hint" id="hint">2=ABC · 3=DEF · # cambia modo</div><div class="softline"><span>Send</span><span>Delete</span></div></section>
<section id="camera" class="page hasback"><button class="backbtn" data-back>‹</button><div class="status"><span>CAMERA</span><span>0.3 MP</span></div><div class="camera"><video id="video" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;filter:contrast(1.2) saturate(.65) sepia(.22)"></video></div><div class="softline"><span>Capture</span><span>Back</span></div></section>
<section id="contacts" class="page hasback"><button class="backbtn" data-back>‹</button><div class="status"><span>CONTACTS</span><span>A-Z</span></div><div class="title">Names</div><div class="rows"><button class="row">Ana</button><button class="row">Carlos</button><button class="row">Mamá</button><button class="row">Jose</button></div><div class="softline"><span>Call</span><span>Back</span></div></section>
<section id="snake" class="page hasback"><button class="backbtn" data-back>‹</button><div class="status"><span>SNAKE</span><span>Score <b id="score">0</b></span></div><canvas id="snakeCanvas" width="320" height="255" style="width:100%;height:255px;image-rendering:pixelated;border:2px solid var(--ink)"></canvas><div class="softline"><span>Restart</span><span>Back</span></div></section>
<section id="settings" class="page hasback"><button class="backbtn" data-back>‹</button><div class="status"><span>SETTINGS</span><span>1/2</span></div><div class="title">Launcher</div><div class="rows"><button class="row" id="themeBtn">Screen color: Yellow</button><button class="row" id="soundBtn">Key sounds: On</button></div><div class="softline"><span>Select</span><span>Back</span></div></section>
</div><div class="keydeck"><div class="navrow"><div style="display:grid;gap:8px"><button class="softkey" id="leftSoft">—</button><button class="callkey green" id="callKey">☎</button></div><div class="navpad"><button class="up">▲</button><button class="left">◀</button><button class="ok">OK</button><button class="right">▶</button><button class="down">▼</button></div><div style="display:grid;gap:8px"><button class="softkey" id="rightSoft">—</button><button class="callkey" id="endKey">⌁</button></div></div><div class="nums" id="nums"></div></div></div>
<script>
const pages=[...document.querySelectorAll('.page')],stack=[];let current='boot',soundOn=true,selected=0,stream=null;function tone(f=480,d=.025){if(!soundOn)return;try{const a=tone.a||(tone.a=new(window.AudioContext||window.webkitAudioContext)),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch{}}function show(id){pages.forEach(p=>p.classList.toggle('on',p.id===id));current=id;tone();if(id==='camera')startCamera();if(id==='snake')startSnake();updateSofts()}function go(id){if(id===current)return;if(current!=='boot')stack.push(current);show(id)}function back(){if(current==='home'||current==='boot')return;show(stack.pop()||'home')}document.addEventListener('click',e=>{const b=e.target.closest('[data-back]');if(b)return back();const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go)});setTimeout(()=>show('home'),700);
const keydefs=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];keydefs.forEach(([n,l])=>{const b=document.createElement('button');b.className='num';b.innerHTML=n+`<span>${l}</span>`;b.onclick=()=>numberPress(n);nums.appendChild(b)});function homeButtons(){return [...document.querySelectorAll('#homeMenu button')]}function moveHome(d){if(current!=='home')return;const bs=homeButtons();selected=(selected+d+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle('selected',i===selected));tone(420)}document.querySelector('.up').onclick=()=>current==='snake'?snakeDir(0,-1):moveHome(-1);document.querySelector('.down').onclick=()=>current==='snake'?snakeDir(0,1):moveHome(1);document.querySelector('.left').onclick=()=>current==='snake'?snakeDir(-1,0):back();document.querySelector('.right').onclick=()=>current==='snake'?snakeDir(1,0):null;document.querySelector('.ok').onclick=()=>{if(current==='home')go(homeButtons()[selected].dataset.go)};endKey.onclick=()=>{if(current!=='home')back()};
let text='',mode='abc',lastKey='',tapIndex=0,timer=null;const letters={2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ'};function renderText(){composeText.textContent=text;count.textContent=text.length;modeLabel.textContent=mode}function addChar(c){if(text.length<160)text+=c;renderText()}function numberPress(k){tone(500);if(current!=='compose')return;if(k==='#'){mode=mode==='abc'?'ABC':mode==='ABC'?'123':'abc';lastKey='';clearTimeout(timer);renderText();return}if(k==='*'){addChar('.');lastKey='';return}if(k==='0'){addChar(' ');lastKey='';clearTimeout(timer);return}if(k==='1'){addChar('1');lastKey='';return}if(mode==='123'){addChar(k);return}const chars=letters[k];if(!chars)return;if(lastKey===k){tapIndex=(tapIndex+1)%chars.length;text=text.slice(0,-1)+(mode==='abc'?chars[tapIndex].toLowerCase():chars[tapIndex])}else{tapIndex=0;text+=(mode==='abc'?chars[0].toLowerCase():chars[0])}lastKey=k;clearTimeout(timer);timer=setTimeout(()=>{lastKey=''},700);renderText()}function updateSofts(){leftSoft.onclick=null;rightSoft.onclick=null;if(current==='compose'){leftSoft.textContent='Send';rightSoft.textContent='Del';rightSoft.onclick=()=>{text=text.slice(0,-1);lastKey='';renderText();tone(330)};leftSoft.onclick=()=>{hint.textContent='Message ready — real sending will use iOS in native version';tone(760,.05)}}else if(current==='camera'){leftSoft.textContent='Shoot';rightSoft.textContent='Back';rightSoft.onclick=back;leftSoft.onclick=()=>tone(880,.06)}else{leftSoft.textContent='Select';rightSoft.textContent='Back';rightSoft.onclick=back}}
async function startCamera(){if(stream)return;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});video.srcObject=stream}catch{document.querySelector('.camera').innerHTML='Camera permission required'}}if(navigator.getBattery)navigator.getBattery().then(b=>battery.textContent=Math.round(b.level*100));let themes=[['#d9e222','#111','Yellow'],['#a7b980','#172012','Green'],['#c3d5d9','#132024','Ice']],ti=0;themeBtn.onclick=()=>{ti=(ti+1)%themes.length;document.documentElement.style.setProperty('--screen',themes[ti][0]);document.documentElement.style.setProperty('--ink',themes[ti][1]);themeBtn.textContent='Screen color: '+themes[ti][2]};soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent='Key sounds: '+(soundOn?'On':'Off')};
const cv=snakeCanvas,cx=cv.getContext('2d'),sz=10,cols=cv.width/sz,rows=cv.height/sz;let snake,food,dir,intv,sc;function newFood(){food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}}function startSnake(){clearInterval(intv);snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];dir={x:1,y:0};sc=0;score.textContent=0;newFood();drawSnake();intv=setInterval(tick,120)}function snakeDir(x,y){if(dir&&dir.x===-x&&dir.y===-y)return;dir={x,y}}function tick(){let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=cols||h.y<0||h.y>=rows||snake.some(s=>s.x===h.x&&s.y===h.y)){clearInterval(intv);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){sc++;score.textContent=sc;newFood()}else snake.pop();drawSnake()}function drawSnake(){const st=getComputedStyle(document.documentElement);cx.fillStyle=st.getPropertyValue('--screen');cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle=st.getPropertyValue('--ink');cx.fillRect(food.x*sz+2,food.y*sz+2,sz-4,sz-4);snake.forEach(s=>cx.fillRect(s.x*sz+1,s.y*sz+1,sz-2,sz-2))}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
