const pages=[...document.querySelectorAll('.page')],stack=[];let current='boot',soundOn=true;function tone(f=520,d=.025){if(!soundOn)return;try{const a=tone.a||(tone.a=new(window.AudioContext||window.webkitAudioContext)),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch{}}function show(id){pages.forEach(p=>p.classList.toggle('on',p.id===id));current=id;tone();if(id==='snake')startSnake();if(id==='camera')startCamera()}function go(id){if(id===current)return;if(current!=='boot')stack.push(current);show(id)}function back(){if(current==='home'||current==='boot')return;show(stack.pop()||'home')}document.addEventListener('click',e=>{let b=e.target.closest('[data-back]');if(b)return back();b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});setTimeout(()=>{stack.length=0;show('home')},900);let ex=0,ey=0,edge=false;addEventListener('touchstart',e=>{let t=e.touches[0];ex=t.clientX;ey=t.clientY;edge=ex<28},{passive:true});addEventListener('touchend',e=>{if(!edge)return;let t=e.changedTouches[0];if(t.clientX-ex>70&&Math.abs(t.clientY-ey)<80)back();edge=false},{passive:true});function clock(){let d=new Date(),hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0'),ds=['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()]+' '+d.getDate()+' '+['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getMonth()];document.getElementById('clock').textContent=hh+':'+mm;document.getElementById('date').textContent=ds}clock();setInterval(clock,1000);if(navigator.getBattery)navigator.getBattery().then(b=>battery.textContent=Math.round(b.level*100));
const map={2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ',0:' '},keys=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']],words={'4652':'HOLA','2272':'CASA','2667':'AMOR','9675':'WORK'};let text='',mode='T9',seq='',last='',tap=0,lastTime=0;keys.forEach(([n,s])=>{let b=document.createElement('button');b.className='key';b.innerHTML=n+'<span>'+s+'</span>';b.onclick=()=>press(n);keypad.appendChild(b)});function render(){composeText.textContent=text+(seq?'['+seq+']':'');count.textContent=(text+seq).length;suggest.textContent=seq?(words[seq]||'…'):''}function commit(){if(seq){text+=(words[seq]||seq)+' ';seq='';render()}}function press(k){tone(470);if(k==='#'){mode=mode==='T9'?'ABC':'T9';modeBtn.textContent=mode;modeLabel.textContent=mode+' ●';commit();return}if(k==='*'){text+='.';render();return}if(k==='1'){text+='1';render();return}if(mode==='T9'){if(k==='0')return commit();if(map[k]){seq+=k;render()}return}let now=Date.now(),chars=map[k]||k;if(k==='0'){text+=' ';last='';return render()}if(last===k&&now-lastTime<700)text=text.slice(0,-1)+chars[++tap%chars.length];else{tap=0;text+=chars[0]}last=k;lastTime=now;render()}modeBtn.onclick=()=>press('#');deleteBtn.onclick=()=>{if(seq)seq=seq.slice(0,-1);else text=text.slice(0,-1);render();tone(350)};
const pals=[['#a7b980','#172012','GREEN'],['#d0c47d','#241d0d','AMBER'],['#b7c4c8','#162023','ICE']];let pi=0;theme.onclick=()=>{pi=(pi+1)%pals.length;document.documentElement.style.setProperty('--lcd',pals[pi][0]);document.documentElement.style.setProperty('--ink',pals[pi][1]);theme.textContent=pals[pi][2]};sound.onclick=()=>{soundOn=!soundOn;sound.textContent=soundOn?'ON':'OFF'};
let stream;async function startCamera(){if(stream)return;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});video.srcObject=stream;video.style.filter='contrast(1.15) saturate(.7) sepia(.18)'}catch{video.outerHTML='<div class="cameraView">◉<small>Camera permission required</small></div>'}}capture.onclick=()=>{if(!stream)return;photo.width=video.videoWidth;photo.height=video.videoHeight;let x=photo.getContext('2d');x.filter='contrast(1.15) saturate(.7) sepia(.18)';x.drawImage(video,0,0);tone(900,.06)};
const c=snakeCanvas,x=c.getContext('2d'),sz=12,cols=c.width/sz,rows=c.height/sz;let snake,food,dir,timer,sc=0;function foodNew(){food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}}function startSnake(){clearInterval(timer);snake=[{x:10,y:12},{x:9,y:12},{x:8,y:12}];dir={x:1,y:0};sc=0;score.textContent=0;foodNew();draw();timer=setInterval(tick,120)}function tick(){let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=cols||h.y<0||h.y>=rows||snake.some(s=>s.x===h.x&&s.y===h.y)){clearInterval(timer);tone(180,.15);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){sc++;score.textContent=sc;foodNew();tone(800)}else snake.pop();draw()}function draw(){let st=getComputedStyle(document.documentElement);x.fillStyle=st.getPropertyValue('--lcd');x.fillRect(0,0,c.width,c.height);x.fillStyle=st.getPropertyValue('--ink');x.fillRect(food.x*sz+3,food.y*sz+3,sz-6,sz-6);snake.forEach(s=>x.fillRect(s.x*sz+1,s.y*sz+1,sz-2,sz-2))}function setDir(a,b){if(dir&&dir.x===-a&&dir.y===-b)return;dir={x:a,y:b}}document.querySelector('.u').onclick=()=>setDir(0,-1);document.querySelector('.d').onclick=()=>setDir(0,1);document.querySelector('.l').onclick=()=>setDir(-1,0);document.querySelector('.r').onclick=()=>setDir(1,0);restart.onclick=startSnake;
