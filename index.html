<style>
:root{--body:#0b0b0b;--screen:#d9e222;--ink:#111;--green:#7dff2f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}html,body{margin:0;height:100%;background:#050505;font-family:"Courier New",monospace;overflow:hidden}body{display:grid;place-items:center}.phone{width:390px;height:100dvh;max-width:100vw;max-height:844px;background:var(--body);padding:max(10px,env(safe-area-inset-top)) 16px max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;color:#fff;overflow:hidden}.brand{text-align:center;font:900 18px Arial,sans-serif;letter-spacing:-1px;height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:center}.display{height:345px;flex:0 0 345px;background:var(--screen);color:var(--ink);border-radius:18px;border:3px solid #191919;box-shadow:inset 0 0 0 3px #f0f45d55;overflow:hidden;position:relative}.page{position:absolute;inset:0;display:none;flex-direction:column;padding:18px}.page.on{display:flex}.page.cameraMode{padding:0}.status{font-size:13px;font-weight:900;display:flex;justify-content:space-between}.title{text-align:center;font-weight:900;font-size:18px;margin:6px 0 10px}.menu{display:flex;flex-direction:column;gap:2px}.menu button,.row{border:0;background:transparent;color:var(--ink);font:900 17px/1.1 monospace;text-align:left;padding:10px 8px}.menu button.selected{background:#343434;color:#fff}.softline{margin-top:auto;display:flex;justify-content:space-between;font-size:13px;font-weight:900}.messagebox{border:2px solid var(--ink);min-height:90px;padding:8px;font:900 17px monospace;overflow:auto}.hint{font-size:12px;margin-top:6px;min-height:15px}.rows{border-top:2px solid var(--ink)}.row{display:block;width:100%;border-bottom:2px solid var(--ink)}.row small{display:block;font-size:11px}.cameraFull{position:absolute;inset:0;background:#101010;overflow:hidden}.cameraPixel{width:100%;height:100%;display:block;background:#111;object-fit:cover}.camExit{position:absolute;top:8px;left:10px;border:0;background:rgba(0,0,0,.24);color:#fff;font:900 28px monospace;line-height:1;padding:2px 8px;border-radius:10px;z-index:5}.camBadge{position:absolute;bottom:8px;right:10px;background:rgba(0,0,0,.28);color:#fff;font:900 11px monospace;padding:3px 7px;border-radius:8px;letter-spacing:.5px}.camToast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;padding:6px 10px;border-radius:10px;font:900 12px monospace;opacity:0;transition:opacity .2s;pointer-events:none}.camToast.show{opacity:1}.keydeck{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}.navrow{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;align-items:center;flex:0 0 82px}.softkey,.callkey,.navpad,.num{border:0;color:#fff;background:linear-gradient(#292929,#151515);box-shadow:inset 0 1px 0 #4b4b4b,0 3px 8px #000;border-radius:14px;font-weight:900}.softkey{height:38px}.callkey{height:38px;font-size:23px}.callkey.green{color:var(--green)}.navpad{height:78px;border:3px solid #efefef;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:3px}.navpad button{background:none;border:0;color:#fff;font-size:16px}.navpad .ok{grid-column:2;grid-row:2;border:2px solid #777;border-radius:7px}.up{grid-column:2}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}.nums{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,minmax(0,1fr));gap:6px;flex:1;min-height:0}.num{min-height:0;height:auto;font:900 18px Arial,sans-serif;padding:2px 0}.num span{display:block;font:700 9px Arial,sans-serif;margin-top:2px;letter-spacing:.3px}.num:active,.softkey:active,.callkey:active{transform:translateY(1px);filter:brightness(1.3)}.backbtn{position:absolute;top:9px;left:10px;border:0;background:none;font:900 26px monospace;color:var(--ink);z-index:4}.hasback .status{padding-left:22px}.counter{text-align:right;font-size:11px;margin-top:3px}.boot{align-items:center;justify-content:center;text-align:center}.boot h1{font-size:28px;margin:0 0 12px}.boot p{font-size:12px}@media(min-width:500px){.phone{border-radius:48px;box-shadow:0 30px 90px #000;height:min(94vh,844px)}}
</style></head>
<body><div class="phone"><div class="brand">NOKIA</div><div class="display">
<section id="boot" class="page boot on"><h1>NOKIA OS</h1><p>Classic interaction.<br>Modern phone.</p></section>
<section id="home" class="page"><div class="status"><span id="signal">▂▄▆█</span><span><b id="battery">76</b>% ▣</span></div><div class="title">Go to</div><div class="menu" id="homeMenu"><button class="selected" data-go="messages">Messages</button><button data-go="camera">Camera</button><button data-go="snake">Snake Classic Game</button><button data-go="contacts">Contacts</button><button data-go="settings">Customize Launcher</button></div><div class="softline"><span>Select</span><span>Exit</span></div></section>
<section id="messages" class="page hasback"><button class="backbtn" data-back>‹</button><div class="status"><span>MESSAGES</span><span>3</span></div><div class="title">Inbox</div><div class="rows"><button class="row" data-go="compose">New message</button><button class="row">Ana<small>¿Dónde estás?</small></button><button class="row">Mamá<small>Llámame luego</small></button></div><div class="softline"><span>Select</span><span>Back</span></div></section>
<section id="compose" class="page hasback"><button class="backbtn" data-back>‹</button><div class="status"><span>NEW MESSAGE</span><span id="modeLabel">abc</span></div><div class="messagebox" id="composeText"></div><div class="counter"><span id="count">0</span>/160</div><div class="hint" id="hint">2=ABC · 3=DEF · # cambia modo</div><div class="softline"><span>Send</span><span>Delete</span></div></section>
<section id="camera" class="page cameraMode"><div class="cameraFull"><button class="camExit" data-back>‹</button><video id="video" autoplay playsinline muted style="display:none"></video><canvas id="camCanvas" class="cameraPixel" width="360" height="345"></canvas><div class="camBadge" id="camBadge">N95 · 5MP</div><div class="camToast" id="camToast">Saved</div></div></section>
<section id="contacts" class="page hasback"><button class="backbtn" data-back>‹</button><div class="status"><span>CONTACTS</span><span>A-Z</span></div><div class="title">Names</div><div class="rows"><button class="row">Ana</button><button class="row">Carlos</button><button class="row">Mamá</button><button class="row">Jose</button></div><div class="softline"><span>Call</span><span>Back</span></div></section>
<section id="snake" class="page hasback"><button class="backbtn" data-back>‹</button><div class="status"><span>SNAKE</span><span>Score <b id="score">0</b></span></div><canvas id="snakeCanvas" width="320" height="255" style="width:100%;height:255px;image-rendering:pixelated;border:2px solid var(--ink)"></canvas><div class="softline"><span>Restart</span><span>Back</span></div></section>
<section id="settings" class="page hasback"><button class="backbtn" data-back>‹</button><div class="status"><span>SETTINGS</span><span>1/2</span></div><div class="title">Launcher</div><div class="rows"><button class="row" id="themeBtn">Screen color: Yellow</button><button class="row" id="soundBtn">Key sounds: On</button></div><div class="softline"><span>Select</span><span>Back</span></div></section>
</div><div class="keydeck"><div class="navrow"><div style="display:grid;gap:8px"><button class="softkey" id="leftSoft">—</button><button class="callkey green" id="callKey">☎</button></div><div class="navpad"><button class="up">▲</button><button class="left">◀</button><button class="ok">OK</button><button class="right">▶</button><button class="down">▼</button></div><div style="display:grid;gap:8px"><button class="softkey" id="rightSoft">—</button><button class="callkey" id="endKey">⌁</button></div></div><div class="nums" id="nums"></div></div></div>
<script>
const pages=[...document.querySelectorAll('.page')],stack=[];let current='boot',soundOn=true,selected=0,stream=null,camLoop=0,toastTimer=0,reviewMode=false,capturedBlob=null,audioCtx=null;function ensureAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch{return null}}document.addEventListener('pointerdown',ensureAudio,{passive:true});function clickTone(type='key'){if(!soundOn)return;const a=ensureAudio();if(!a)return;try{const now=a.currentTime;if(type==='capture'){const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.setValueAtTime(1050,now);o.frequency.exponentialRampToValueAtTime(620,now+.07);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.045,now+.004);g.gain.exponentialRampToValueAtTime(.0001,now+.095);o.connect(g);g.connect(a.destination);o.start(now);o.stop(now+.1);return}const n=a.createBuffer(1,Math.floor(a.sampleRate*.018),a.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();src.buffer=n;f.type='bandpass';f.frequency.value=type==='nav'?1150:1550;f.Q.value=1.4;g.gain.value=type==='nav'?.035:.045;src.connect(f);f.connect(g);g.connect(a.destination);src.start(now)}catch{}}function show(id){pages.forEach(p=>p.classList.toggle('on',p.id===id));current=id;clickTone('nav');if(id==='camera'){reviewMode=false;capturedBlob=null;startCamera();}if(id==='snake')startSnake();updateSofts()}function go(id){if(id===current)return;if(current!=='boot')stack.push(current);show(id)}function back(){if(current==='home'||current==='boot')return;show(stack.pop()||'home')}document.addEventListener('click',e=>{const b=e.target.closest('[data-back]');if(b)return back();const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go)});setTimeout(()=>show('home'),700);
const keydefs=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];keydefs.forEach(([n,l])=>{const b=document.createElement('button');b.className='num';b.innerHTML=n+`<span>${l}</span>`;b.onclick=()=>numberPress(n);nums.appendChild(b)});function homeButtons(){return [...document.querySelectorAll('#homeMenu button')]}function moveHome(d){if(current!=='home')return;const bs=homeButtons();selected=(selected+d+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle('selected',i===selected));clickTone('nav')}document.querySelector('.up').onclick=()=>current==='snake'?snakeDir(0,-1):moveHome(-1);document.querySelector('.down').onclick=()=>current==='snake'?snakeDir(0,1):moveHome(1);document.querySelector('.left').onclick=()=>current==='snake'?snakeDir(-1,0):back();document.querySelector('.right').onclick=()=>current==='snake'?snakeDir(1,0):null;document.querySelector('.ok').onclick=()=>{clickTone('nav');if(current==='home')go(homeButtons()[selected].dataset.go);else if(current==='camera'){reviewMode?saveCapture():captureFrame()}};endKey.onclick=()=>{clickTone('nav');if(current!=='home')back()};callKey.onclick=()=>clickTone('nav');
let text='',mode='abc',lastKey='',tapIndex=0,timer=null;const letters={2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ'};function renderText(){composeText.textContent=text;count.textContent=text.length;modeLabel.textContent=mode}function addChar(c){if(text.length<160)text+=c;renderText()}function numberPress(k){clickTone('key');if(current!=='compose')return;if(k==='#'){mode=mode==='abc'?'ABC':mode==='ABC'?'123':'abc';lastKey='';clearTimeout(timer);renderText();return}if(k==='*'){addChar('.');lastKey='';return}if(k==='0'){addChar(' ');lastKey='';clearTimeout(timer);return}if(k==='1'){addChar('1');lastKey='';return}if(mode==='123'){addChar(k);return}const chars=letters[k];if(!chars)return;if(lastKey===k){tapIndex=(tapIndex+1)%chars.length;text=text.slice(0,-1)+(mode==='abc'?chars[tapIndex].toLowerCase():chars[tapIndex])}else{tapIndex=0;text+=(mode==='abc'?chars[0].toLowerCase():chars[0])}lastKey=k;clearTimeout(timer);timer=setTimeout(()=>{lastKey=''},700);renderText()}function updateSofts(){leftSoft.onclick=null;rightSoft.onclick=null;if(current==='compose'){leftSoft.textContent='Send';rightSoft.textContent='Del';rightSoft.onclick=()=>{clickTone('nav');text=text.slice(0,-1);lastKey='';renderText()};leftSoft.onclick=()=>{clickTone('capture');hint.textContent='Message ready — real sending llegará en la versión nativa'}}else if(current==='camera'){if(reviewMode){leftSoft.textContent='Save';rightSoft.textContent='Retake';leftSoft.onclick=()=>saveCapture();rightSoft.onclick=()=>retakeCamera()}else{leftSoft.textContent='Shoot';rightSoft.textContent='Exit';rightSoft.onclick=()=>{clickTone('nav');back()};leftSoft.onclick=()=>captureFrame()}}else{leftSoft.textContent='Select';rightSoft.textContent='Back';rightSoft.onclick=()=>{clickTone('nav');back()};leftSoft.onclick=()=>clickTone('nav')}}
async function startCamera(){if(stream){video.play().catch(()=>{});startN95Preview();return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;await video.play().catch(()=>{});startN95Preview()}catch{const holder=document.querySelector('.cameraFull');holder.innerHTML='<button class="camExit" data-back>‹</button><div style="position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:900 16px monospace;text-align:center">Camera permission required</div>'}}function drawCover(ctx,src,w,h){const sw=src.videoWidth||src.width,sh=src.videoHeight||src.height;if(!sw||!sh)return;const sr=sw/sh,tr=w/h;let sx=0,sy=0,cw=sw,ch=sh;if(sr>tr){cw=sh*tr;sx=(sw-cw)/2}else{ch=sw/tr;sy=(sh-ch)/2}ctx.drawImage(src,sx,sy,cw,ch,0,0,w,h)}function startN95Preview(){cancelAnimationFrame(camLoop);reviewMode=false;camBadge.textContent='N95 · 5MP';const out=camCanvas.getContext('2d');out.imageSmoothingEnabled=true;let last=0;function draw(t=0){if(current==='camera'&&!reviewMode&&video.readyState>=2&&t-last>55){last=t;out.save();out.filter='contrast(1.08) saturate(1.12) brightness(.98)';drawCover(out,video,camCanvas.width,camCanvas.height);out.filter='none';out.fillStyle='rgba(238,175,105,.035)';out.fillRect(0,0,camCanvas.width,camCanvas.height);out.restore()}camLoop=requestAnimationFrame(draw)}draw()}function showCamToast(msg='Saved'){camToast.textContent=msg;camToast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>camToast.classList.remove('show'),1200)}async function captureFrame(){if(current!=='camera'||reviewMode||video.readyState<2)return;clickTone('capture');cancelAnimationFrame(camLoop);const work=document.createElement('canvas');work.width=1296;work.height=972;const wx=work.getContext('2d',{willReadFrequently:true});wx.filter='contrast(1.11) saturate(1.16) brightness(.985)';drawCover(wx,video,work.width,work.height);wx.filter='none';const img=wx.getImageData(0,0,work.width,work.height),d=img.data;for(let i=0;i<d.length;i+=4){const noise=(Math.random()-.5)*7;d[i]=Math.max(0,Math.min(255,d[i]+noise+2));d[i+1]=Math.max(0,Math.min(255,d[i+1]+noise));d[i+2]=Math.max(0,Math.min(255,d[i+2]+noise-2))}wx.putImageData(img,0,0);const exportCanvas=document.createElement('canvas');exportCanvas.width=2592;exportCanvas.height=1944;const ex=exportCanvas.getContext('2d');ex.imageSmoothingEnabled=true;ex.imageSmoothingQuality='medium';ex.drawImage(work,0,0,exportCanvas.width,exportCanvas.height);capturedBlob=await new Promise(res=>exportCanvas.toBlob(res,'image/jpeg',.76));const preview=camCanvas.getContext('2d');preview.imageSmoothingEnabled=true;preview.filter='contrast(1.05) saturate(1.08)';preview.drawImage(work,0,0,camCanvas.width,camCanvas.height);preview.filter='none';reviewMode=true;camBadge.textContent='PHOTO · 5MP';updateSofts();showCamToast('Photo taken')}function retakeCamera(){clickTone('nav');reviewMode=false;capturedBlob=null;camBadge.textContent='N95 · 5MP';updateSofts();video.play().catch(()=>{});startN95Preview()}async function saveCapture(){if(!capturedBlob)return;clickTone('capture');const file=new File([capturedBlob],`nokia-n95-${Date.now()}.jpg`,{type:'image/jpeg'});if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){try{await navigator.share({files:[file],title:'Nokia N95 Photo'});showCamToast('Saved / shared');setTimeout(retakeCamera,450);return}catch(e){if(e&&e.name==='AbortError')return}}const url=URL.createObjectURL(capturedBlob);const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showCamToast('Saved');setTimeout(retakeCamera,450)}
if(navigator.getBattery)navigator.getBattery().then(b=>battery.textContent=Math.round(b.level*100));let themes=[["#d9e222","#111","Yellow"],["#a7b980","#172012","Green"],["#c3d5d9","#132024","Ice"]],ti=0;themeBtn.onclick=()=>{clickTone('nav');ti=(ti+1)%themes.length;document.documentElement.style.setProperty('--screen',themes[ti][0]);document.documentElement.style.setProperty('--ink',themes[ti][1]);themeBtn.textContent='Screen color: '+themes[ti][2]};soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent='Key sounds: '+(soundOn?'On':'Off');if(soundOn)clickTone('nav')};
const cv=snakeCanvas,cx=cv.getContext('2d'),sz=10,cols=cv.width/sz,rows=cv.height/sz;let snake,food,dir,intv,sc;function newFood(){food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}}function startSnake(){clearInterval(intv);snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];dir={x:1,y:0};sc=0;score.textContent=0;newFood();drawSnake();intv=setInterval(tick,120)}function snakeDir(x,y){if(dir&&dir.x===-x&&dir.y===-y)return;dir={x,y};clickTone('nav')}function tick(){let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=cols||h.y<0||h.y>=rows||snake.some(s=>s.x===h.x&&s.y===h.y)){clearInterval(intv);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){sc++;score.textContent=sc;newFood();clickTone('capture')}else snake.pop();drawSnake()}function drawSnake(){const st=getComputedStyle(document.documentElement);cx.fillStyle=st.getPropertyValue('--screen');cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle=st.getPropertyValue('--ink');cx.fillRect(food.x*sz+2,food.y*sz+2,sz-4,sz-4);snake.forEach(s=>cx.fillRect(s.x*sz+1,s.y*sz+1,sz-2,sz-2))}if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
