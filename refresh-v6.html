<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nokia OS v6 refresh</title><style>body{margin:0;background:#050505;color:#d9e222;font-family:monospace;display:grid;place-items:center;height:100vh;text-align:center}p{max-width:280px;line-height:1.5}</style></head><body><p>Updating Nokia OS to v6…<br>Please wait.</p><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}if('serviceWorker'in navigator){await navigator.serviceWorker.register('./sw.js?v=6',{scope:'./'});await navigator.serviceWorker.ready;await new Promise(r=>setTimeout(r,700));}location.replace('./index.html?v=6&fresh='+Date.now());}catch(e){location.replace('./index.html?v=6&fresh='+Date.now());}})();</script></body></html>
