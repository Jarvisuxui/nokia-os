<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Refreshing Nokia OS</title><style>html,body{height:100%;margin:0;background:#050505;color:#d9e222;font-family:monospace;display:grid;place-items:center;text-align:center}main{padding:24px}b{font-size:22px}</style></head><body><main><b>Refreshing Nokia OS…</b><p>Clearing old cache.</p></main><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}}catch(e){}setTimeout(()=>location.replace('./index.html?fresh='+Date.now()),700)})();</script></body></html>
